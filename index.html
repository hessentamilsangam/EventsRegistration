<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registration System</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>
body { font-family: Arial, sans-serif; background: #f2f2f2; margin: 0; padding: 0;}
header { background: #007bff; color: white; padding: 15px; text-align:center; font-size:1.2em; }
nav { display:flex; justify-content:center; background:#eee; }
nav button { margin:5px; padding:10px 20px; border:none; border-radius:5px; cursor:pointer; background:#007bff; color:white; }
nav button.active { background:#0056b3; }
section { display:none; padding:20px; max-width:700px; margin:auto; background:white; border-radius:10px; margin-top:20px;}
input, button { width:100%; padding:10px; margin-top:10px; font-size:16px; border-radius:6px; }
button:hover { opacity:0.9; }
#qr-reader { margin-top:15px; display:none;}
#resultBox, #dashboardTable { margin-top:15px;}
#resultBox { padding:15px; background:#f9f9f9; border-radius:8px; display:none;}
.success { color:green; } .warning { color:orange; } .error { color:red; }
table { width:100%; border-collapse:collapse; margin-top:10px;}
th, td { border:1px solid #ccc; padding:8px; text-align:center;}
th { background:#007bff; color:white;}
</style>
</head>
<body>

<header>Registration System</header>
<nav>
  <button class="tabBtn active" onclick="showSection('scanSection', this)">Scan / Verify</button>
  <button class="tabBtn" onclick="showSection('dashboardSection', this)">Dashboard</button>
</nav>

<!-- SCAN / VERIFY SECTION -->
<section id="scanSection" style="display:block;">
  <input type="password" id="passwordInput" placeholder="Enter password">
  <button onclick="startScanning()">📷 Scan QR Code</button>
  <div id="qr-reader"></div>
  <input id="regIdInput" placeholder="Registration ID">
  <button onclick="submitId()">Submit</button>

  <div id="resultBox">
    <div id="statusMsg"></div>
    <div id="fullNameMsg"></div>
    <div id="attendeeMsg"></div>
  </div>
</section>

<!-- DASHBOARD SECTION -->
<section id="dashboardSection">
  <h3 style="text-align:center;">Event Dashboard</h3>
  <table id="dashboardTable">
    <thead>
      <tr>
        <th>Member Type</th>
        <th>Adults</th>
        <th>Kids</th>
        <th>Veg</th>
        <th>NonVeg</th>
        <th>Attend</th>
        <th>Payment</th>
      </tr>
    </thead>
    <tbody id="dashboardBody">
      <!-- Exactly 3 rows will be rendered here: Member, Non-member, Total -->
    </tbody>
  </table>
</section>

<script>
const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwV-NgdRQWlAw-FD7FMqPjKz0Qq26daPmTW5Dj1qoBmb563WoHWokLZKLXV8kpNichX/exec"; // <-- replace with your /exec URL

// TAB SWITCHING
function showSection(id, btn){
  document.querySelectorAll('section').forEach(s=>s.style.display='none');
  document.getElementById(id).style.display='block';
  document.querySelectorAll('.tabBtn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  if(id==='dashboardSection'){ loadDashboard(); }
}

/* -------------------------
   QR SCANNING
--------------------------*/
let scanner = null;
let scanning = false;

function startScanning() {
  let qrDiv = document.getElementById("qr-reader");
  if (scanning) { stopScanning(); return; }

  qrDiv.style.display = "block";
  scanner = new Html5Qrcode("qr-reader");

  Html5Qrcode.getCameras().then(devices => {
    let backCam = devices.find(d => d.label.toLowerCase().includes("back")) || devices[0];
    scanning = true;
    scanner.start(
      backCam.id,
      { fps:10, qrbox:250 },
      qrText => {
        document.getElementById("regIdInput").value = qrText;
        stopScanning();
      }
    );
  }).catch(()=>{ showStatus("Camera not accessible","error"); });
}

function stopScanning(){
  if(scanner && scanning){
    scanner.stop().then(()=>{
      document.getElementById("qr-reader").style.display="none";
      scanning=false;
    });
  }
}

/* -------------------------
   SUBMIT REGISTRATION ID
--------------------------*/
function submitId() {
  const regId = document.getElementById("regIdInput").value.trim();
  const pass = document.getElementById("passwordInput").value.trim();
  if(!pass){ showStatus("Enter password","error"); return; }
  if(!regId){ showStatus("Enter or scan registration ID","warning"); return; }

  fetch(`${WEB_APP_URL}?mode=verify&registrationId=${encodeURIComponent(regId)}&password=${encodeURIComponent(pass)}`)
    .then(res=>res.json())
    .then(data=>handleResponse(data))
    .catch(()=>showStatus("Server error. Try again.","error"));
}

function handleResponse(data){
  document.getElementById("resultBox").style.display="block";

  if(data.status==="AUTH_FAILED"){ showStatus("Incorrect password","error"); return; }
  if(data.status==="MISSING_ID"){ showStatus("Missing registration ID","error"); return; }

  let cssClass = data.status==="Updated successfully"?"success":
                 data.status==="Already updated"?"warning":"error";

  showStatus(data.status, cssClass);
  document.getElementById("fullNameMsg").innerHTML = data.fullName ? "Name: <b>"+data.fullName+"</b>":"";
  document.getElementById("attendeeMsg").innerHTML = data.attendeeNames ? "Attendees: <b>"+data.attendeeNames+"</b>":"";
}

function showStatus(msg,type){ 
  const el = document.getElementById("statusMsg"); 
  el.className=type; 
  el.innerHTML=msg;
}

/* -------------------------
   DASHBOARD
--------------------------*/
function safeNum(v){
  const n = Number(v);
  return Number.isFinite(n) ? Math.round(n) : 0;
}

function loadDashboard(){
  const tbody = document.getElementById("dashboardBody");
  tbody.innerHTML=""; // clear

  // Initialize aggregates for members and non-members
  const memberTotals = { adults:0, kids:0, veg:0, nonveg:0, attend:0, paid:0 };
  const nonMemberTotals = { adults:0, kids:0, veg:0, nonveg:0, attend:0, paid:0 };

  fetch(`${WEB_APP_URL}?mode=dashboard`)
    .then(res=>res.json())
    .then(data=>{
      // Data is expected to be an array of registrations
      // Each registration has: isMember, foodPreference, adults, kids, attendStatus, paymentStatus
      
      if(Array.isArray(data)){
        data.forEach(record => {
          // Determine if member or non-member
          const isMember = (record.isMember || '').toString().toLowerCase() === 'yes';
          const target = isMember ? memberTotals : nonMemberTotals;
          
          // Count adults
          target.adults += safeNum(record.adults || 0);
          
          // Count kids (only if present, not "none")
          if(record.kids && record.kids.toString().toLowerCase() !== 'none'){
            target.kids += safeNum(record.kids);
          }
          
          // Count food preference
          if(record.foodPreference){
            const food = record.foodPreference.toString().toLowerCase();
            if(food.includes('veg')){
              target.veg += 1;
            } else if(food.includes('non')){
              target.nonveg += 1;
            }
          }
          
          // Count attend status (ok = attended)
          if(record.attendStatus === 'ok'){
            target.attend += 1;
          }
          
          // Count payment status (ok = paid)
          if(record.paymentStatus === 'ok'){
            target.paid += 1;
          }
        });
      } else {
        // If data is an object keyed by event names, handle that structure
        for(const eventName in data){
          const eventRecords = data[eventName];
          if(Array.isArray(eventRecords)){
            eventRecords.forEach(record => {
              const isMember = (record.isMember || '').toString().toLowerCase() === 'yes';
              const target = isMember ? memberTotals : nonMemberTotals;
              
              target.adults += safeNum(record.adults || 0);
              
              if(record.kids && record.kids.toString().toLowerCase() !== 'none'){
                target.kids += safeNum(record.kids);
              }
              
              if(record.foodPreference){
                const food = record.foodPreference.toString().toLowerCase();
                if(food.includes('veg')){
                  target.veg += 1;
                } else if(food.includes('non')){
                  target.nonveg += 1;
                }
              }
              
              if(record.attendStatus === 'ok'){
                target.attend += 1;
              }
              
              if(record.paymentStatus === 'ok'){
                target.paid += 1;
              }
            });
          }
        }
      }

      // Compute totals (sum of member + non-member)
      const total = {
        adults: memberTotals.adults + nonMemberTotals.adults,
        kids: memberTotals.kids + nonMemberTotals.kids,
        veg: memberTotals.veg + nonMemberTotals.veg,
        nonveg: memberTotals.nonveg + nonMemberTotals.nonveg,
        attend: memberTotals.attend + nonMemberTotals.attend,
        paid: memberTotals.paid + nonMemberTotals.paid
      };

      function rowHtml(label, t){
        return `<tr>`+
               `<td>${label}</td>`+
               `<td>${t.adults}</td>`+
               `<td>${t.kids}</td>`+
               `<td>${t.veg}</td>`+
               `<td>${t.nonveg}</td>`+
               `<td>${t.attend}</td>`+
               `<td>${t.paid}</td>`+
               `</tr>`;
      }

      // Render exactly 3 rows
      tbody.innerHTML += rowHtml('Member', memberTotals);
      tbody.innerHTML += rowHtml('Non-member', nonMemberTotals);
      tbody.innerHTML += rowHtml('Total', total);

    })
    .catch(()=>{
      // If fetch fails, still render three empty rows to respect the requirement
      tbody.innerHTML += `<tr><td>Member</td><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td></tr>`;
      tbody.innerHTML += `<tr><td>Non-member</td><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td></tr>`;
      tbody.innerHTML += `<tr><td>Total</td><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td></tr>`;
      // Also notify user
      alert("Failed to load dashboard");
    });
}
</script>

</body>
</html>
