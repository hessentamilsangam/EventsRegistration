<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registration System</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>
body { font-family: Arial, sans-serif; background: #f2f2f2; margin: 0; padding: 0;}
header { background: #007bff; color: white; padding: 15px; text-align:center; font-size:1.2em; }
nav { display:flex; justify-content:center; background:#eee; }
nav button { margin:5px; padding:10px 20px; border:none; border-radius:5px; cursor:pointer; background:#007bff; color:white; }
nav button.active { background:#0056b3; }
section { display:none; padding:20px; max-width:700px; margin:auto; background:white; border-radius:10px; margin-top:20px;}
input, button { width:100%; padding:10px; margin-top:10px; font-size:16px; border-radius:6px; }
button:hover { opacity:0.9; }
#qr-reader { margin-top:15px; display:none;}
#resultBox, #dashboardTable { margin-top:15px;}
#resultBox { padding:15px; background:#f9f9f9; border-radius:8px; display:none;}
.success { color:green; } .warning { color:orange; } .error { color:red; }
table { width:100%; border-collapse:collapse; margin-top:10px;}
th, td { border:1px solid #ccc; padding:8px; text-align:center;}
th { background:#007bff; color:white;}
</style>
</head>
<body>

<header>Registration System</header>
<nav>
  <button class="tabBtn active" onclick="showSection('scanSection', this)">Scan / Verify</button>
  <button class="tabBtn" onclick="showSection('dashboardSection', this)">Dashboard</button>
</nav>

<!-- SCAN / VERIFY SECTION -->
<section id="scanSection" style="display:block;">
  <input type="password" id="passwordInput" placeholder="Enter password">
  <button id="scanBtn" onclick="startScanning()">📷 Scan QR Code</button>
  <div id="qr-reader"></div>
  <input id="regIdInput" placeholder="Registration ID (or scanned value)">
  <input id="emailInput" placeholder="Email (optional)">
  <button id="submitBtn" onclick="submitId()">Submit</button>

  <div id="resultBox">
    <div id="statusMsg"></div>
    <div id="fullNameMsg"></div>
    <div id="attendeeMsg"></div>
  </div>
</section>

<!-- DASHBOARD SECTION -->
<section id="dashboardSection">
  <h3 style="text-align:center;">Event Dashboard</h3>
  <table id="dashboardTable">
    <thead>
      <tr>
        <th>Registrations</th>
        <th>Member Type</th>
        <th>Adults</th>
        <th>Kids</th>
        <th>Veg</th>
        <th>NonVeg</th>
        <th>Attend</th>
        <th>Payment</th>
      </tr>
    </thead>
    <tbody id="dashboardBody">
      <!-- Exactly 3 rows will be rendered here: Member, Non-member, Total -->
    </tbody>
  </table>
</section>

<script>
const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwV-NgdRQWlAw-FD7FMqPjKz0Qq26daPmTW5Dj1qoBmb563WoHWokLZKLXV8kpNichX/exec"; // <-- replace with your /exec URL

// TAB SWITCHING
function showSection(id, btn){
  document.querySelectorAll('section').forEach(s=>s.style.display='none');
  document.getElementById(id).style.display='block';
  document.querySelectorAll('.tabBtn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  if(id==='dashboardSection'){ loadDashboard(); }
}

/* -------------------------
   QR SCANNING
--------------------------*/
let scanner = null;
let scanning = false;

function startScanning() {
  const scanBtn = document.getElementById('scanBtn');
  let qrDiv = document.getElementById("qr-reader");
  if (scanning) { stopScanning(); return; }

  qrDiv.style.display = "block";
  scanner = new Html5Qrcode("qr-reader");

  Html5Qrcode.getCameras().then(devices => {
    let backCam = devices.find(d => d.label.toLowerCase().includes("back")) || devices[0];
    scanning = true;
    scanBtn.innerText = 'Stop Scanning';
    scanner.start(
      backCam.id,
      { fps:10, qrbox:250 },
      qrText => {
        // Populate email if scanned text looks like an email, otherwise registration id
        if (typeof qrText === 'string' && qrText.includes('@')) {
          document.getElementById('emailInput').value = qrText;
        } else {
          document.getElementById('regIdInput').value = qrText;
        }
        stopScanning();
      }
    );
  }).catch(()=>{ showStatus("Camera not accessible","error"); });
}

function stopScanning(){
  const scanBtn = document.getElementById('scanBtn');
  if(scanner && scanning){
    scanner.stop().then(()=>{
      document.getElementById("qr-reader").style.display="none";
      scanning=false;
      scanBtn.innerText = '📷 Scan QR Code';
      scanBtn.disabled = false;
    }).catch(()=>{
      // ensure UI reset even if stop fails
      document.getElementById("qr-reader").style.display="none";
      scanning=false;
      scanBtn.innerText = '📷 Scan QR Code';
      scanBtn.disabled = false;
    });
  } else {
    // nothing to stop, ensure button text is correct
    scanBtn.innerText = '📷 Scan QR Code';
    scanBtn.disabled = false;
  }
}

/* -------------------------
   SUBMIT REGISTRATION ID / EMAIL
--------------------------*/
function submitId() {
  const regId = document.getElementById("regIdInput").value.trim();
  const email = document.getElementById("emailInput").value.trim();
  const pass = document.getElementById("passwordInput").value.trim();
  const submitBtn = document.getElementById('submitBtn');
  const scanBtn = document.getElementById('scanBtn');

  if(!pass){ showStatus("Enter password","error"); return; }

  // build URL params - include registrationId if present, otherwise email
  const params = new URLSearchParams();
  params.append('mode','verify');
  params.append('password', pass);
  if(regId){ params.append('registrationId', regId); }
  else { params.append('email', email); }

  // show loading state
  setLoading(true);
  showStatus('Verifying...', '');
  document.getElementById('resultBox').style.display='block';

  fetch(`${WEB_APP_URL}?${params.toString()}`)
    .then(res=>res.json())
    .then(data=>handleResponse(data))
    .catch(()=>showStatus("Server error. Try again.","error"))
    .finally(()=> setLoading(false));
}

function handleResponse(data){
  document.getElementById("resultBox").style.display="block";

  if(data.status==="AUTH_FAILED"){ showStatus("Incorrect password","error"); return; }
  if(data.status==="MISSING_ID"){ showStatus("Missing registration ID","error"); return; }

  let cssClass = data.status==="Updated successfully"?"success":
                 data.status==="Already updated"?"warning":"error";

  showStatus(data.status, cssClass);
  document.getElementById("fullNameMsg").innerHTML = data.fullName ? "Name: <b>"+escapeHtml(data.fullName)+"</b>":"";
  document.getElementById("attendeeMsg").innerHTML = data.attendeeNames ? "Attendees: <b>"+escapeHtml(data.attendeeNames)+"</b>":"";
}

function showStatus(msg,type){ 
  const el = document.getElementById("statusMsg"); 
  el.className=type; 
  el.innerHTML=msg;
}

function setLoading(isLoading){
  const submitBtn = document.getElementById('submitBtn');
  const scanBtn = document.getElementById('scanBtn');
  if(isLoading){
    submitBtn.dataset.origText = submitBtn.innerHTML;
    submitBtn.innerHTML = 'Verifying...';
    submitBtn.disabled = true;
    scanBtn.disabled = true;
  } else {
    submitBtn.innerHTML = submitBtn.dataset.origText || 'Submit';
    submitBtn.disabled = false;
    scanBtn.disabled = false;
  }
}

// small helper to avoid injecting raw HTML from responses
function escapeHtml(unsafe) {
  return String(unsafe)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/\"/g, '&quot;')
    .replace(/\'/g, '&#039;');
}

/* -------------------------
   DASHBOARD
--------------------------*/
function safeNum(v){
  const n = Number(v);
  return Number.isFinite(n) ? Math.round(n) : 0;
}

function loadDashboard(){
  const tbody = document.getElementById("dashboardBody");
  tbody.innerHTML=""; // clear

  // render helper expects objects with the new 'registrations' property
  function rowHtml(label, t){
    return `<tr>`+
           `<td>${t.registrations || 0}</td>`+
           `<td>${label}</td>`+
           `<td>${t.adults || 0}</td>`+
           `<td>${t.kids || 0}</td>`+
           `<td>${t.veg || 0}</td>`+
           `<td>${t.nonveg || 0}</td>`+
           `<td>${t.attend || 0}</td>`+
           `<td>${t.paid || 0}</td>`+
           `</tr>`;
  }

  fetch(`${WEB_APP_URL}?mode=dashboard`)
    .then(res=>{
      const contentType = (res.headers.get('content-type') || '');
      if (!res.ok || !contentType.includes('application/json')) {
        throw new Error('Web app did not return JSON. It may require Google sign-in (302 redirect). Open the web app /exec URL in Incognito to confirm.');
      }
      return res.json();
    })
    .then(data=>{
      console.log("dashboard fetch response:", data);

      // If backend returns the new aggregated shape
      if (data && typeof data === 'object' && 'member' in data && 'nonMember' in data && 'total' in data) {
        tbody.innerHTML += rowHtml('Member', data.member);
        tbody.innerHTML += rowHtml('Non-member', data.nonMember);
        tbody.innerHTML += rowHtml('Total', data.total);
        return;
      }

      // Fallback: if data is array of records, compute aggregates client-side (also count unique registrationIds)
      const memberTotals = { registrationsSet: new Set(), adults:0, kids:0, veg:0, nonveg:0, attend:0, paid:0 };
      const nonMemberTotals = { registrationsSet: new Set(), adults:0, kids:0, veg:0, nonveg:0, attend:0, paid:0 };
      const allIds = new Set();

      if (Array.isArray(data)) {
        data.forEach(record => {
          const regId = (record.registrationId || record.registrationId === 0) ? String(record.registrationId).trim() : ('row_' + Math.random().toString(36).slice(2,8));
          allIds.add(regId);

          const isMember = (record.isMember || '').toString().toLowerCase() === 'yes';
          const target = isMember ? memberTotals : nonMemberTotals;

          target.registrationsSet.add(regId);
          target.adults += safeNum(record.adults || 0);

          if(record.kids && record.kids.toString().toLowerCase() !== 'none'){
            target.kids += safeNum(record.kids);
          }

          if(record.foodPreference){
            const food = record.foodPreference.toString().toLowerCase();
            if(food.includes('veg')){
              target.veg += 1;
            } else if(food.includes('non')){
              target.nonveg += 1;
            }
          }

          if((record.attendStatus || '').toString().toLowerCase() === 'ok'){
            target.attend += 1;
          }

          if((record.paymentStatus || '').toString().toLowerCase() === 'ok'){
            target.paid += 1;
          }
        });

        const memberOut = {
          registrations: memberTotals.registrationsSet.size,
          adults: memberTotals.adults,
          kids: memberTotals.kids,
          veg: memberTotals.veg,
          nonveg: memberTotals.nonveg,
          attend: memberTotals.attend,
          paid: memberTotals.paid
        };
        const nonMemberOut = {
          registrations: nonMemberTotals.registrationsSet.size,
          adults: nonMemberTotals.adults,
          kids: nonMemberTotals.kids,
          veg: nonMemberTotals.veg,
          nonveg: nonMemberTotals.nonveg,
          attend: nonMemberTotals.attend,
          paid: nonMemberTotals.paid
        };
        const totalOut = {
          registrations: allIds.size,
          adults: memberOut.adults + nonMemberOut.adults,
          kids: memberOut.kids + nonMemberOut.kids,
          veg: memberOut.veg + nonMemberOut.veg,
          nonveg: memberOut.nonveg + nonMemberOut.nonveg,
          attend: memberOut.attend + nonMemberOut.attend,
          paid: memberOut.paid + nonMemberOut.paid
        };

        tbody.innerHTML += rowHtml('Member', memberOut);
        tbody.innerHTML += rowHtml('Non-member', nonMemberOut);
        tbody.innerHTML += rowHtml('Total', totalOut);
        return;
      }

      // Unknown shape: render zeros but keep three rows as required
      tbody.innerHTML += rowHtml('Member', { registrations:0, adults:0, kids:0, veg:0, nonveg:0, attend:0, paid:0 });
      tbody.innerHTML += rowHtml('Non-member', { registrations:0, adults:0, kids:0, veg:0, nonveg:0, attend:0, paid:0 });
      tbody.innerHTML += rowHtml('Total', { registrations:0, adults:0, kids:0, veg:0, nonveg:0, attend:0, paid:0 });
    })
    .catch(err=>{
      console.error("Failed to load dashboard", err);
      tbody.innerHTML += rowHtml('Member', { registrations:0, adults:0, kids:0, veg:0, nonveg:0, attend:0, paid:0 });
      tbody.innerHTML += rowHtml('Non-member', { registrations:0, adults:0, kids:0, veg:0, nonveg:0, attend:0, paid:0 });
      tbody.innerHTML += rowHtml('Total', { registrations:0, adults:0, kids:0, veg:0, nonveg:0, attend:0, paid:0 });
      alert("Failed to load dashboard: " + (err && err.message ? err.message : 'unknown error'));
    });
}
</script>

</body>
</html>
