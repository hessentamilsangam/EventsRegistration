<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Registration System</title>
<script src="https://unpkg.com/html5-qrcode"></script>

<style>
*{box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#f2f2f2;margin:0}
header{background:#007bff;color:#fff;padding:15px;text-align:center;font-size:1.2em}
nav{display:flex;justify-content:center;background:#eee}
nav button{margin:5px;padding:10px 20px;border:0;border-radius:5px;cursor:pointer;background:#007bff;color:#fff}
nav button.active{background:#0056b3}
section{display:none;padding:20px;max-width:700px;margin:20px auto;background:#fff;border-radius:10px}
input,button{width:100%;padding:10px;margin-top:10px;font-size:16px;border-radius:6px}
button{border:0;cursor:pointer;background:#007bff;color:#fff}
button:hover{opacity:.9}
button:disabled{opacity:.6;cursor:not-allowed}
#qr-reader{margin-top:15px;display:none}
#resultBox{margin-top:15px;padding:15px;background:#f9f9f9;border-radius:8px;display:none}
#dashboardTable{width:100%;border-collapse:collapse;margin-top:15px}
th,td{border:1px solid #ccc;padding:8px;text-align:center}
th{background:#007bff;color:#fff}
.success{color:green}.warning{color:#d88900}.error{color:red}
#updatePaymentBtn{display:none;background:#28a745}
#paymentUpdateMsg{margin-top:10px}
</style>
</head>

<body>

<header>Registration System</header>

<nav>
  <button class="tabBtn active" onclick="showSection('scanSection',this)">Scan / Verify</button>
  <button class="tabBtn" onclick="showSection('dashboardSection',this)">Dashboard</button>
</nav>

<!-- SCAN / VERIFY -->
<section id="scanSection" style="display:block">
  <input type="password" id="passwordInput" placeholder="Enter password">
  <button id="scanBtn" onclick="startScanning()">📷 Scan QR Code</button>
  <div id="qr-reader"></div>

  <input id="regIdInput" placeholder="Registration ID (or scanned value)">
  <input id="emailInput" placeholder="Email (optional)">

  <button id="submitBtn" onclick="submitId()">Submit</button>
  <button id="resetBtn" type="button" onclick="resetForm()" style="background:#6c757d">🔄 Reset</button>

  <div id="resultBox">
    <div id="statusMsg"></div>
    <div id="regIdMsg"></div>
    <div id="emailMsg"></div>
    <div id="fullNameMsg"></div>
    <div id="attendeeMsg"></div>
    <div id="paymentMsg"></div>

    <button id="updatePaymentBtn" type="button" onclick="updatePayment()">💳 Update Payment</button>
    <div id="paymentUpdateMsg"></div>
  </div>
</section>

<!-- DASHBOARD -->
<section id="dashboardSection">
  <h3 style="text-align:center">Event Dashboard</h3>
  <table id="dashboardTable">
    <thead>
      <tr>
        <th>Member Type</th><th>Registrations</th><th>Adults</th><th>Kids</th>
        <th>Veg</th><th>NonVeg</th><th>Attend</th><th>Payment</th>
      </tr>
    </thead>
    <tbody id="dashboardBody"></tbody>
  </table>
</section>

<script>
const WEB_APP_URL="https://script.google.com/macros/s/AKfycby5xcTNwlMmTeb_HTqrELoWeaj0Okn0rfrKMVTXLqU1NAyc0qKNlaj5fHFlF1rzT_l1/exec";
let scanner=null,scanning=false,verifyController=null;

/* TABS */
function showSection(id,btn){
  document.querySelectorAll("section").forEach(s=>s.style.display="none");
  document.getElementById(id).style.display="block";
  document.querySelectorAll(".tabBtn").forEach(b=>b.classList.remove("active"));
  btn.classList.add("active");
  if(id==="dashboardSection")loadDashboard();
}

/* QR SCANNER */
function startScanning(){
  const btn=document.getElementById("scanBtn"),qr=document.getElementById("qr-reader");
  if(scanning){stopScanning();return}
  qr.style.display="block";btn.disabled=true;btn.innerText="Starting camera...";

  try{scanner=new Html5Qrcode("qr-reader")}
  catch(e){qr.style.display="none";btn.disabled=false;btn.innerText="📷 Scan QR Code";showResult("Unable to initialize QR scanner.","error");return}

  Html5Qrcode.getCameras().then(devices=>{
    if(!devices.length)throw new Error("No camera found");
    const cam=devices.find(d=>(d.label||"").toLowerCase().includes("back"))||devices[0];
    scanning=true;btn.disabled=false;btn.innerText="⏹ Stop Scanning";

    return scanner.start(cam.id,{fps:10,qrbox:250},text=>{
      if(typeof text==="string"&&text.includes("@"))
        document.getElementById("emailInput").value=text;
      else
        document.getElementById("regIdInput").value=text;
      stopScanning();
    });
  }).catch(e=>{
    console.error(e);scanning=false;qr.style.display="none";btn.disabled=false;
    btn.innerText="📷 Scan QR Code";
    showResult("Camera not accessible. Please allow camera permission.","error");
  });
}

function stopScanning(){
  const btn=document.getElementById("scanBtn"),qr=document.getElementById("qr-reader");
  if(scanner&&scanning){
    scanner.stop().catch(()=>{}).finally(()=>{
      scanner=null;scanning=false;qr.style.display="none";
      btn.disabled=false;btn.innerText="📷 Scan QR Code";
    });
  }else{
    scanner=null;scanning=false;qr.style.display="none";
    btn.disabled=false;btn.innerText="📷 Scan QR Code";
  }
}

/* SUBMIT / VERIFY */
function submitId(){
  const reg=document.getElementById("regIdInput").value.trim();
  const email=document.getElementById("emailInput").value.trim();
  const pass=document.getElementById("passwordInput").value.trim();

  if(!pass){showResult("Enter password","error");return}
  if(!reg&&!email){showResult("Enter Registration ID or Email","error");return}

  if(verifyController)verifyController.abort();
  verifyController=new AbortController();

  const p=new URLSearchParams({mode:"verify",password:pass});
  if(reg)p.append("registrationId",reg);else p.append("email",email);

  setLoading(true);showResult("Verifying...","");

  fetch(`${WEB_APP_URL}?${p}`,{signal:verifyController.signal})
    .then(r=>{if(!r.ok)throw Error("HTTP "+r.status);return r.json()})
    .then(handleResponse)
    .catch(e=>{if(e.name!=="AbortError")showResult("Server error. Try again.","error")})
    .finally(()=>{setLoading(false);verifyController=null});
}

/* RESULT */
function handleResponse(data){
  const box=document.getElementById("resultBox"),btn=document.getElementById("updatePaymentBtn");
  box.style.display="block";
  btn.style.display="none";btn.disabled=false;btn.innerText="💳 Update Payment";
  btn.dataset.registrationId="";
  document.getElementById("paymentUpdateMsg").innerHTML="";

  if(data.status==="AUTH_FAILED"){showResult("Incorrect password","error");return}
  if(data.status==="MISSING_ID"){showResult("Missing registration ID","error");return}

  const cls=data.status==="Updated successfully"?"success":data.status==="Already updated"?"warning":"error";
  showResult(data.status||"Unknown response",cls);

  document.getElementById("regIdMsg").innerHTML=data.registrationId?"Registration ID: <b>"+escapeHtml(data.registrationId)+"</b>":"";
  document.getElementById("emailMsg").innerHTML=data.email?"Email: <b>"+escapeHtml(data.email)+"</b>":"";
  document.getElementById("fullNameMsg").innerHTML=data.fullName?"Name: <b>"+escapeHtml(data.fullName)+"</b>":"";
  document.getElementById("attendeeMsg").innerHTML=data.attendeeNames?"Attendees: <b>"+escapeHtml(data.attendeeNames)+"</b>":"";
  document.getElementById("paymentMsg").innerHTML=data.paymentStatus?"Payment Status: <b>"+escapeHtml(data.paymentStatus)+"</b>":"";

  if(data.registrationId){
    btn.dataset.registrationId=String(data.registrationId).trim();
    btn.style.display="block";
  }
}

/* UPDATE PAYMENT */
function updatePayment(){
  const btn=document.getElementById("updatePaymentBtn");
  const msg=document.getElementById("paymentUpdateMsg");
  const reg=btn.dataset.registrationId;
  const pass=document.getElementById("passwordInput").value.trim();

  if(!reg){msg.innerHTML='<span class="error">Registration ID is missing.</span>';return}
  if(!pass){msg.innerHTML='<span class="error">Password is missing.</span>';return}

  btn.disabled=true;btn.innerText="Updating Payment...";
  msg.className="";msg.innerText="Updating payment...";

  const p=new URLSearchParams({mode:"updatePayment",password:pass,registrationId:reg});

  fetch(`${WEB_APP_URL}?${p}`)
    .then(r=>{if(!r.ok)throw Error("HTTP "+r.status);return r.json()})
    .then(data=>{
      if(data.status==="Payment updated successfully"){
        msg.innerHTML='<span class="success">✅ Payment updated successfully.</span>';
        document.getElementById("paymentMsg").innerHTML="Payment Status: <b>OK</b>";
        btn.innerText="✅ Payment Updated";
        btn.disabled=true;
      }else if(data.status==="Payment already updated"){
        msg.innerHTML='<span class="warning">Payment is already updated.</span>';
        document.getElementById("paymentMsg").innerHTML="Payment Status: <b>OK</b>";
        btn.innerText="✅ Already Updated";
        btn.disabled=true;
      }else{
        msg.innerHTML='<span class="error">'+escapeHtml(data.message||data.status||"Payment update failed.")+'</span>';
        btn.disabled=false;btn.innerText="💳 Update Payment";
      }
    })
    .catch(e=>{
      console.error(e);
      msg.innerHTML='<span class="error">Server error while updating payment.</span>';
      btn.disabled=false;btn.innerText="💳 Update Payment";
    });
}

/* RESET */
function resetForm(){
  if(verifyController){verifyController.abort();verifyController=null}

  const finish=()=>{
    ["passwordInput","regIdInput","emailInput"].forEach(id=>document.getElementById(id).value="");

    const btn=document.getElementById("scanBtn");
    btn.disabled=false;btn.innerText="📷 Scan QR Code";
    document.getElementById("qr-reader").style.display="none";

    document.getElementById("resultBox").style.display="none";
    ["statusMsg","regIdMsg","emailMsg","fullNameMsg","attendeeMsg","paymentMsg","paymentUpdateMsg"]
      .forEach(id=>document.getElementById(id).innerHTML="");

    const pay=document.getElementById("updatePaymentBtn");
    pay.style.display="none";pay.disabled=false;
    pay.innerText="💳 Update Payment";pay.dataset.registrationId="";
    scanner=null;scanning=false;
  };

  if(scanner&&scanning)
    scanner.stop().catch(()=>{}).finally(finish);
  else finish();
}

/* UI HELPERS */
function showResult(msg,type){
  const box=document.getElementById("resultBox");
  box.style.display="block";
  const el=document.getElementById("statusMsg");
  el.className=type||"";el.innerHTML=msg;
}

function setLoading(load){
  const sub=document.getElementById("submitBtn"),scan=document.getElementById("scanBtn");
  if(load){
    sub.dataset.origText=sub.innerHTML;sub.innerText="Verifying...";sub.disabled=true;scan.disabled=true;
  }else{
    sub.innerText=sub.dataset.origText||"Submit";sub.disabled=false;scan.disabled=scanning;
  }
}

function escapeHtml(v){
  return String(v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");
}

/* DASHBOARD */
function zeroRow(){return{registrations:0,adults:0,kids:0,veg:0,nonveg:0,attend:0,paid:0}}
function safeNum(v){const n=Number(v);return Number.isFinite(n)?Math.round(n):0}

function loadDashboard(){
  const body=document.getElementById("dashboardBody");
  body.innerHTML="";

  const row=(label,t)=>`<tr><td>${label}</td><td>${t.registrations||0}</td><td>${t.adults||0}</td><td>${t.kids||0}</td><td>${t.veg||0}</td><td>${t.nonveg||0}</td><td>${t.attend||0}</td><td>${t.paid||0}</td></tr>`;

  fetch(`${WEB_APP_URL}?mode=dashboard`)
    .then(r=>{
      const ct=(r.headers.get("content-type")||"").toLowerCase();
      if(!r.ok||!ct.includes("application/json"))throw Error("Dashboard did not return JSON.");
      return r.json();
    })
    .then(data=>{
      if(data&&typeof data==="object"&&"member"in data&&"nonMember"in data&&"total"in data){
        body.innerHTML+=row("Member",data.member||zeroRow());
        body.innerHTML+=row("Guest",data.memberGuest||zeroRow());
        body.innerHTML+=row("Non-member",data.nonMember||zeroRow());
        body.innerHTML+=row("Total",data.total||zeroRow());
        return;
      }

      if(!Array.isArray(data))return renderZeroRows();

      const groups={
        member:{registrationsSet:new Set(),adults:0,kids:0,veg:0,nonveg:0,attend:0,paid:0},
        guest:{registrationsSet:new Set(),adults:0,kids:0,veg:0,nonveg:0,attend:0,paid:0},
        non:{registrationsSet:new Set(),adults:0,kids:0,veg:0,nonveg:0,attend:0,paid:0}
      },all=new Set();

      data.forEach(r=>{
        const id=(r.registrationId!==undefined&&r.registrationId!=="")?String(r.registrationId).trim():"row_"+Math.random();
        all.add(id);
        const type=String(r.isMember||"").trim().toLowerCase();
        const g=type==="yes"||type==="true"||type==="y"?groups.member:type==="guest"?groups.guest:groups.non;
        g.registrationsSet.add(id);g.adults+=safeNum(r.adults);
        if(r.kids&&String(r.kids).toLowerCase()!=="none")g.kids+=safeNum(r.kids);
        const food=String(r.foodPreference||"").toLowerCase();
        if(food.includes("non"))g.nonveg++;else if(food.includes("veg"))g.veg++;
        if(String(r.attendStatus||"").toLowerCase()==="ok")g.attend++;
        if(String(r.paymentStatus||"").toLowerCase()==="ok")g.paid++;
      });

      const out=g=>({registrations:g.registrationsSet.size,adults:g.adults,kids:g.kids,veg:g.veg,nonveg:g.nonveg,attend:g.attend,paid:g.paid});
      const m=out(groups.member),g=out(groups.guest),n=out(groups.non);
      const t={
        registrations:all.size,
        adults:m.adults+g.adults+n.adults,
        kids:m.kids+g.kids+n.kids,
        veg:m.veg+g.veg+n.veg,
        nonveg:m.nonveg+g.nonveg+n.nonveg,
        attend:m.attend+g.attend+n.attend,
        paid:m.paid+g.paid
      };

      body.innerHTML+=row("Member",m);
      body.innerHTML+=row("Guest",g);
      body.innerHTML+=row("Non-member",n);
      body.innerHTML+=row("Total",t);
    })
    .catch(e=>{
      console.error(e);
      renderZeroRows();
      alert("Failed to load dashboard: "+e.message);
    });

  function renderZeroRows(){
    body.innerHTML=row("Member",zeroRow())+row("Guest",zeroRow())+row("Non-member",zeroRow())+row("Total",zeroRow());
  }
}
</script>

</body>
</html>
